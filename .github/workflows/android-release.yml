name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;27.3.13750724"

      - name: Restore keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_B64 }}" | base64 -d > release.keystore

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Create gradle.properties for CI
        run: |
          cat > gradle.properties <<EOF
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvm.options=-Xmx2g
          org.gradle.parallel=false
          org.gradle.workers.max=2
          APP_VERSION_CODE=1
          APP_VERSION_NAME=dev
          TG_APP_VERSION_CODE=1
          TG_APP_VERSION_NAME=dev
          EOF

      - name: Restore google-services.json
        run: |
          mkdir -p TMessagesProj
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > TMessagesProj/google-services.json

      - name: Generate Extra.java from template
        run: |
          cp TMessagesProj/src/main/java/tw/nekomimi/nekogram/Extra.java.example \
             TMessagesProj/src/main/java/tw/nekomimi/nekogram/Extra.java

      - name: Patch Gradle for CI only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("TMessagesProj/build.gradle")
          s = p.read_text(encoding="utf-8")

          s = s.replace('${APP_VERSION_CODE}', '${project.findProperty("APP_VERSION_CODE") ?: "1"}L')
          s = s.replace('${APP_VERSION_NAME}', '${project.findProperty("APP_VERSION_NAME") ?: "dev"}')
          s = s.replace('${TG_APP_VERSION_CODE}', '${project.findProperty("TG_APP_VERSION_CODE") ?: "1"}L')
          s = s.replace('${TG_APP_VERSION_NAME}', '${project.findProperty("TG_APP_VERSION_NAME") ?: "dev"}')

          p.write_text(s, encoding="utf-8")
          print("Patched", p)
          PY

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nekogram-release
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/**/*.apk
            **/build/outputs/mapping/release/**
