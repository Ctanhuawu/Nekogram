name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;27.3.13750724"

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/build.gradle', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Cache native intermediates
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj_App/.cxx
          key: ${{ runner.os }}-native-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/build.gradle', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-native-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          {
            echo "max_size = 2.0G"
            echo "compression = true"
            echo "compiler_check = content"
          } > ~/.ccache/ccache.conf
          ccache -z

      - name: Restore keystore
        shell: bash
        run: |
          printf '%s' '${{ secrets.RELEASE_KEYSTORE_B64 }}' | base64 -d > release.keystore

      - name: Create local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          storeFile=release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Create gradle.properties for CI
        shell: bash
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION_NAME" ] || [ "$VERSION_NAME" = "$GITHUB_REF_NAME" ]; then
            VERSION_NAME="dev"
          fi
          VERSION_CODE="$(date +%s)"

          cat > gradle.properties <<EOF
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvm.options=-Xmx2g
          org.gradle.parallel=false
          org.gradle.workers.max=2

          APP_VERSION_CODE=${VERSION_CODE}
          APP_VERSION_NAME=${VERSION_NAME}
          TG_APP_VERSION_CODE=${VERSION_CODE}
          TG_APP_VERSION_NAME=${VERSION_NAME}
          APP_PACKAGE=tw.nekomimi.nekogram
          EOF

      - name: Debug GOOGLE_SERVICES_JSON_B64
        shell: bash
        run: |
          SECRET='${{ secrets.GOOGLE_SERVICES_JSON_B64 }}'

          echo "masked direct echo:"
          echo "$SECRET"

          echo "length:"
          printf '%s' "$SECRET" | wc -c

          echo "prefix:"
          printf '%s' "$SECRET" | cut -c 1-80

          echo "sha256:"
          printf '%s' "$SECRET" | sha256sum

      - name: Restore google-services.json
        shell: bash
        run: |
          mkdir -p TMessagesProj_App
          printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON_B64 }}' | base64 -d > TMessagesProj_App/google-services.json

      - name: Validate google-services.json
        shell: bash
        run: |
          test -s TMessagesProj_App/google-services.json

          echo "decoded file size:"
          wc -c TMessagesProj_App/google-services.json

          echo "decoded first 5 lines:"
          sed -n '1,5p' TMessagesProj_App/google-services.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("TMessagesProj_App/google-services.json")
          text = p.read_text(encoding="utf-8")
          data = json.loads(text)
          print("google-services.json OK")
          print("top-level keys:", list(data.keys()))
          PY

      - name: Generate Extra.java from template
        run: |
          cp TMessagesProj/src/main/java/tw/nekomimi/nekogram/Extra.java.example \
             TMessagesProj/src/main/java/tw/nekomimi/nekogram/Extra.java

      - name: Patch Gradle for CI only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch_file(path_str, replacements):
              p = Path(path_str)
              if not p.exists():
                  print(f"Skip missing file: {p}")
                  return
              s = p.read_text(encoding="utf-8")
              original = s
              for old, new in replacements:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding="utf-8")
                  print(f"Patched {p}")
              else:
                  print(f"No changes in {p}")

          patch_file(
              "TMessagesProj/build.gradle",
              [
                  ('${APP_VERSION_CODE}', '${project.findProperty("APP_VERSION_CODE") ?: "1"}L'),
                  ('${APP_VERSION_NAME}', '${project.findProperty("APP_VERSION_NAME") ?: "dev"}'),
                  ('${TG_APP_VERSION_CODE}', '${project.findProperty("TG_APP_VERSION_CODE") ?: "1"}L'),
                  ('${TG_APP_VERSION_NAME}', '${project.findProperty("TG_APP_VERSION_NAME") ?: "dev"}'),
              ]
          )

          patch_file(
              "TMessagesProj_App/build.gradle",
              [
                  (
                      'defaultConfig.applicationId = APP_PACKAGE',
                      'defaultConfig.applicationId = (project.findProperty("APP_PACKAGE") ?: "tw.nekomimi.nekogram")'
                  ),
                  (
                      'defaultConfig.versionCode = Integer.parseInt(APP_VERSION_CODE)',
                      'defaultConfig.versionCode = Integer.parseInt((project.findProperty("APP_VERSION_CODE") ?: "1").toString())'
                  ),
                  (
                      'versionName APP_VERSION_NAME',
                      'versionName (project.findProperty("APP_VERSION_NAME") ?: "dev").toString()'
                  ),
              ]
          )
          PY

      - name: Show patched Gradle files
        run: |
          echo "===== TMessagesProj/build.gradle ====="
          sed -n '90,120p' TMessagesProj/build.gradle || true
          echo "===== TMessagesProj_App/build.gradle ====="
          sed -n '1,90p' TMessagesProj_App/build.gradle || true

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nekogram-release
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/**/*.apk
            **/build/outputs/mapping/release/**
