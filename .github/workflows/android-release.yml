name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;27.3.13750724" \
            "cmake;4.0.0"

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/*.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          {
            echo "max_size = 2.0G"
            echo "compression = true"
            echo "compiler_check = content"
          } > ~/.ccache/ccache.conf
          ccache -z

      - name: Restore keystore
        shell: bash
        run: |
          printf '%s' '${{ secrets.RELEASE_KEYSTORE_B64 }}' | base64 -d > release.keystore
          test -s release.keystore

      - name: Create local.properties
        shell: bash
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          storeFile=$GITHUB_WORKSPACE/release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Restore google-services.json from secret
        if: ${{ secrets.GOOGLE_SERVICES_JSON_B64 != '' }}
        shell: bash
        run: |
          mkdir -p TMessagesProj_App
          printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON_B64 }}' | base64 -d > TMessagesProj_App/google-services.json
          test -s TMessagesProj_App/google-services.json

      - name: Validate google-services.json
        shell: bash
        run: |
          if [ -f TMessagesProj_App/google-services.json ]; then
            test -s TMessagesProj_App/google-services.json
          elif [ -f google-services.json ]; then
            test -s google-services.json
          else
            echo "google-services.json not found"
            exit 1
          fi

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :TMessagesProj_App:assembleRelease --stacktrace --console=plain

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nekogram-release
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
            TMessagesProj_App/build/outputs/mapping/release/**
            TMessagesProj_App/build/outputs/native-debug-symbols/release/**
