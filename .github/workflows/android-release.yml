name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    environment: Release
    timeout-minutes: 90

    env:
      GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      EXTRA_APP_ID: ${{ secrets.EXTRA_APP_ID }}
      EXTRA_APP_HASH: ${{ secrets.EXTRA_APP_HASH }}
      EXTRA_PLAYSTORE_APP_URL: ${{ secrets.EXTRA_PLAYSTORE_APP_URL }}
      EXTRA_WS_USER_AGENT: ${{ secrets.EXTRA_WS_USER_AGENT }}
      EXTRA_WS_CONN_HASH: ${{ secrets.EXTRA_WS_CONN_HASH }}
      EXTRA_WS_DEFAULT_DOMAIN: ${{ secrets.EXTRA_WS_DEFAULT_DOMAIN }}
      EXTRA_TWPIC_BOT_USERNAME: ${{ secrets.EXTRA_TWPIC_BOT_USERNAME }}
      EXTRA_FORCE_ANALYTICS: ${{ secrets.EXTRA_FORCE_ANALYTICS }}
      EXTRA_TLV_URL: ${{ secrets.EXTRA_TLV_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "ndk;27.3.13750724"

          CMAKE_PACKAGE="$(sdkmanager --list | awk '/^  cmake;4\./ { print $1 }' | sort -V | tail -n 1)"
          if [ -z "$CMAKE_PACKAGE" ]; then
            echo "No CMake 4.x package found in sdkmanager output"
            exit 1
          fi
          echo "Installing $CMAKE_PACKAGE"
          sdkmanager "$CMAKE_PACKAGE"

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake', '**/*.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          mkdir -p ~/.ccache
          {
            echo "max_size = 2.0G"
            echo "compression = true"
            echo "compiler_check = content"
          } > ~/.ccache/ccache.conf
          ccache -z

      - name: Restore keystore
        shell: bash
        run: |
          printf '%s' '${{ secrets.RELEASE_KEYSTORE_B64 }}' | base64 -d > release.keystore
          test -s release.keystore

      - name: Create local.properties
        shell: bash
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          storeFile=$GITHUB_WORKSPACE/release.keystore
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Generate Extra.java from secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          required = {
              "EXTRA_APP_ID": os.environ.get("EXTRA_APP_ID", "").strip(),
              "EXTRA_APP_HASH": os.environ.get("EXTRA_APP_HASH", "").strip(),
          }
          missing = [name for name, value in required.items() if not value]
          if missing:
              raise SystemExit(f"Missing required secrets: {', '.join(missing)}")

          def java_string(value: str | None, *, nullable: bool = False) -> str:
              value = (value or "").strip()
              if not value:
                  return "null" if nullable else '""'
              escaped = (
                  value.replace("\\", "\\\\")
                  .replace('"', '\\"')
                  .replace("\n", "\\n")
              )
              return f'"{escaped}"'

          force_analytics = os.environ.get("EXTRA_FORCE_ANALYTICS", "").strip().lower()
          if force_analytics not in {"", "true", "false"}:
              raise SystemExit("EXTRA_FORCE_ANALYTICS must be true or false when set")

          template_path = Path("TMessagesProj/src/main/java/tw/nekomimi/nekogram/Extra.java.example")
          output_path = Path("TMessagesProj/src/main/java/tw/nekomimi/nekogram/Extra.java")
          template = template_path.read_text(encoding="utf-8")

          replacements = {
              "public static final int APP_ID = 0;": f"public static final int APP_ID = {required['EXTRA_APP_ID']};",
              'public static final String APP_HASH = "";': f"public static final String APP_HASH = {java_string(required['EXTRA_APP_HASH'])};",
              'public static final String PLAYSTORE_APP_URL = "";': f"public static final String PLAYSTORE_APP_URL = {java_string(os.environ.get('EXTRA_PLAYSTORE_APP_URL'))};",
              'public static String WS_USER_AGENT = "";': f"public static String WS_USER_AGENT = {java_string(os.environ.get('EXTRA_WS_USER_AGENT'))};",
              'public static String WS_CONN_HASH = "";': f"public static String WS_CONN_HASH = {java_string(os.environ.get('EXTRA_WS_CONN_HASH'))};",
              'public static String WS_DEFAULT_DOMAIN = "";': f"public static String WS_DEFAULT_DOMAIN = {java_string(os.environ.get('EXTRA_WS_DEFAULT_DOMAIN'))};",
              'public static String TWPIC_BOT_USERNAME = null;': f"public static String TWPIC_BOT_USERNAME = {java_string(os.environ.get('EXTRA_TWPIC_BOT_USERNAME'), nullable=True)};",
              "public static boolean FORCE_ANALYTICS = false;": f"public static boolean FORCE_ANALYTICS = {force_analytics or 'false'};",
              'public static String TLV_URL = "";': f"public static String TLV_URL = {java_string(os.environ.get('EXTRA_TLV_URL'))};",
          }

          content = template
          for source, target in replacements.items():
              if source not in content:
                  raise SystemExit(f"Template marker not found: {source}")
              content = content.replace(source, target, 1)

          output_path.write_text(content, encoding="utf-8")
          print(f"Wrote {output_path}")
          PY

      - name: Restore google-services.json from secret
        if: ${{ env.GOOGLE_SERVICES_JSON_B64 != '' }}
        shell: bash
        run: |
          mkdir -p TMessagesProj_App
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > TMessagesProj_App/google-services.json
          test -s TMessagesProj_App/google-services.json

      - name: Validate google-services.json
        shell: bash
        run: |
          if [ -f TMessagesProj_App/google-services.json ]; then
            test -s TMessagesProj_App/google-services.json
          elif [ -f google-services.json ]; then
            test -s google-services.json
          else
            echo "google-services.json not found"
            exit 1
          fi

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :TMessagesProj_App:assembleRelease :TMessagesProj_App:uploadCrashlyticsSymbolFileRelease --stacktrace --console=plain

      - name: Show ccache stats
        if: always()
        run: ccache -s

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nekogram-release
          path: |
            TMessagesProj_App/build/outputs/apk/**/*.apk
            TMessagesProj_App/build/outputs/mapping/release/**
            TMessagesProj_App/build/outputs/native-debug-symbols/release/**
